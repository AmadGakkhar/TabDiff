[data]
dequant_dist = "none"
int_dequant_factor = 0

[unimodmlp_params]
num_layers = 2
d_token = 4
n_head = 1
factor = 32
bias = true
use_mlp = true
dim_t = 1024

[diffusion_params]
num_timesteps = 100
scheduler = "power_mean"
cat_scheduler = "log_linear"
noise_dist = "uniform_t"

[diffusion_params.sampler_params]
stochastic_sampler = true
second_order_correction = true

[diffusion_params.edm_params]
precond = true
sigma_data = 1.0
net_conditioning = "sigma"

[diffusion_params.noise_dist_params]
P_mean = -1.2
P_std = 1.2

[diffusion_params.noise_schedule_params]
sigma_min = 0.002
sigma_max = 80
rho = 7
eps_max = 0.001
eps_min = 1e-05
rho_init = 7.0
rho_offset = 5.0
k_init = -6.0
k_offset = 1.0

[train.main]
lr = 0.001
ema_decay = 0.997
lr_scheduler = "reduce_lr_on_plateau"
factor = 0.9
closs_weight_schedule = "anneal"
c_lambda = 1.0
d_lambda = 1.0
batch_size = 2048
steps = 5500
weight_decay = 0
check_val_every = 2000
reduce_lr_patience = 50

[sample]
batch_size = 4096
